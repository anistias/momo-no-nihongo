<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Momo Nihongo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: kolom tunggal di HP dengan tab bawah; di layar lebar tab pindah ke sisi kiri. Gaya "stiker": garis tebal dan bayangan keras. */
:root{
  --bg:#E9F3FF; --bg2:#D9E9FF; --surface:#FFFFFF; --surface2:#F3F8FF;
  --ink:#262A5C; --ink2:#575C92; --line:#C9D9F2; --edge:#2B2F66;
  --orange:#FF9A3C; --onorange:#3A1A00;
  --orange-s:#FFE2C2; --orange-i:#7A3A00;
  --pink:#FFD6E4; --pink-i:#8A2347;
  --mint:#C9F2DF; --mint-i:#0F5C3D;
  --lemon:#FFF1B8; --lemon-i:#6B5200;
  --lilac:#E1D8FF; --lilac-i:#4A3A9C;
  --sky:#CFE5FF; --sky-i:#1F4F8F;
  --good:#18865A; --bad:#C23A63;
  --f-d:'Baloo 2','Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;
  --f-b:'Nunito','Zen Maru Gothic','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-jp:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic UI','Noto Sans JP',sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161A38; --bg2:#1E2347; --surface:#242954; --surface2:#2C3263;
  --ink:#F1F3FF; --ink2:#B3B9EA; --line:#3A4080; --edge:#0A0C24;
  --orange-s:#5A3A1C; --orange-i:#FFD3A1;
  --pink:#5C2B4A; --pink-i:#FFC9DD;
  --mint:#1E4C44; --mint-i:#B8F2D8;
  --lemon:#554A1C; --lemon-i:#FFE98A;
  --lilac:#40367D; --lilac-i:#DCD3FF;
  --sky:#27407C; --sky-i:#BBD9FF;
  --good:#5FD9A6; --bad:#FF8FB0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161A38; --bg2:#1E2347; --surface:#242954; --surface2:#2C3263;
  --ink:#F1F3FF; --ink2:#B3B9EA; --line:#3A4080; --edge:#0A0C24;
  --orange-s:#5A3A1C; --orange-i:#FFD3A1;
  --pink:#5C2B4A; --pink-i:#FFC9DD;
  --mint:#1E4C44; --mint-i:#B8F2D8;
  --lemon:#554A1C; --lemon-i:#FFE98A;
  --lilac:#40367D; --lilac-i:#DCD3FF;
  --sky:#27407C; --sky-i:#BBD9FF;
  --good:#5FD9A6; --bad:#FF8FB0; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-d);line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.jp{font-family:var(--f-jp)}
ruby rt{font-size:.5em;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.nofuri rt,.nofuri .fr{display:none}
.rv{gap:8px}.rv .qjp{font-size:30px;line-height:1.6}
.ic{width:20px;height:20px;flex:none}
.ic.on{fill:currentColor}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:10px}

.shell{max-width:1000px;margin:0 auto}
.main{display:flex;flex-direction:column;gap:20px;padding-block:14px 108px;min-width:0}
#view{display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:6px;font-family:var(--f-d);font-weight:800;font-size:20px;color:var(--ink);text-decoration:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:2px solid var(--edge);background:var(--surface);font-weight:800;font-size:13px;line-height:1.2}
.chip .ic{width:16px;height:16px}
.chip[aria-pressed="false"]{background:var(--bg2);color:var(--ink2);text-decoration:line-through}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:4px;background:var(--surface);border-top:2.5px solid var(--edge);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:11px;font-weight:800;color:var(--ink2);text-decoration:none}
.nav a[aria-current="page"]{background:var(--orange-s);color:var(--orange-i)}
@media (min-width:880px){
  .shell{display:grid;grid-template-columns:190px minmax(0,1fr);gap:28px;padding-top:14px}
  .nav{position:sticky;top:16px;left:auto;right:auto;bottom:auto;align-self:start;flex-direction:column;border:2.5px solid var(--edge);border-radius:20px;box-shadow:0 5px 0 var(--edge);padding:10px}
  .nav a{flex-direction:row;font-size:15px;gap:10px;padding:10px 12px}
  .main{padding-bottom:48px}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:14px;border:2.5px solid var(--edge);
  background:var(--surface);font-weight:800;box-shadow:0 4px 0 var(--edge);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn.pri{background:var(--orange);color:var(--onorange)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;box-shadow:0 3px 0 var(--edge)}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;border:2px solid var(--edge);background:var(--surface);flex:none}
.iconbtn.on{background:var(--lemon);color:var(--lemon-i)}
.card{background:var(--surface);border:2.5px solid var(--edge);border-radius:var(--r);box-shadow:0 5px 0 var(--edge);padding:16px;min-width:0}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;min-width:0}
.muted{color:var(--ink2)}
.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
h2{font-size:26px}
h3{font-size:19px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

.c-pink{background:var(--pink);color:var(--pink-i)}
.c-mint{background:var(--mint);color:var(--mint-i)}
.c-lemon{background:var(--lemon);color:var(--lemon-i)}
.c-lilac{background:var(--lilac);color:var(--lilac-i)}
.c-sky{background:var(--sky);color:var(--sky-i)}
.c-orange{background:var(--orange-s);color:var(--orange-i)}
.chg{background:var(--lemon);color:var(--lemon-i);border-radius:6px;padding:0 .3em;font-weight:800}
details.kj{padding:10px 14px}details.kj summary{display:flex;gap:12px;align-items:center}.kjb{font-size:34px;font-weight:700;line-height:1.2;min-width:1.3em;text-align:center}.kjr{margin:6px 0}
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.kgrid.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kc{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border-radius:12px;border:2.5px solid var(--edge);background:var(--surface);box-shadow:0 3px 0 var(--edge)}
.kc:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}.kc b{font-size:26px;line-height:1.3;font-weight:700}.kc span{font-size:12px;font-weight:800;color:var(--ink2)}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800}

/* Momo */
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}
.bubble{position:relative;background:var(--surface);border:2.5px solid var(--edge);border-radius:20px;padding:12px 16px;font-weight:700;box-shadow:0 4px 0 var(--edge)}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--surface);border-left:2.5px solid var(--edge);border-bottom:2.5px solid var(--edge);transform:rotate(45deg)}
.momo{display:block;overflow:visible}
.momo .tail{transform-origin:150px 196px;animation:wag 2.4s ease-in-out infinite}
.momo .scarf{transform-origin:158px 150px;animation:flap 1.8s ease-in-out infinite}
.momo .blink{transform-origin:110px 96px;animation:blink 4.5s infinite}
.momo.cheer{animation:bob .5s ease-in-out infinite alternate}
@keyframes wag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(9deg)}}
@keyframes flap{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes pop{from{transform:scale(.94);opacity:.4}to{transform:scale(1);opacity:1}}
.pop{animation:pop .18s ease-out}

.goal{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{width:84px;height:84px}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--bg2)}
.ring .fg{stroke:var(--orange);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{font-family:var(--f-d);font-weight:800;font-size:20px;fill:var(--ink)}
.bar{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--orange);border-radius:99px}

.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.act{display:flex;flex-direction:column;gap:4px;text-align:left;align-items:flex-start;cursor:pointer;padding:14px 16px}
.act strong{font-family:var(--f-d);font-size:19px;line-height:1.2}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lesson{border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-height:84px}
.lesson.lock{background:var(--bg2);color:var(--ink2)}
.lesson .n{font-family:var(--f-d);font-weight:800;font-size:18px}

/* belajar */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;list-style:none;margin:0;padding:0}
.pcard{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:2.5px solid var(--edge);background:var(--surface);box-shadow:0 4px 0 var(--edge)}
.pcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.mark{display:flex;align-items:center;justify-content:center;width:56px;height:56px;border-radius:14px;font-family:var(--f-jp);font-weight:700;font-size:28px;line-height:1}
.mark.sm{width:44px;height:44px;font-size:22px}
.done{color:var(--good)}
.fm{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.blk{padding:8px 12px;border-radius:12px;font-family:var(--f-jp);font-weight:700;font-size:18px;line-height:1.3}
.k-n{background:var(--pink);color:var(--pink-i)}
.k-p{background:var(--orange);color:var(--onorange)}
.k-v{background:var(--mint);color:var(--mint-i)}
.k-e{background:var(--lilac);color:var(--lilac-i)}
.k-q{background:var(--lemon);color:var(--lemon-i)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:800}
.ex{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:2px dashed var(--line)}
.ex:first-child{border-top:0;padding-top:0}
.ex .jp{font-size:20px;line-height:2.1;font-weight:500}
.callout{border-radius:16px;padding:14px 16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.callout h3{font-size:16px;margin-bottom:2px}
details.more{background:var(--surface);border-radius:var(--r);padding:12px 16px}
details.more summary{font-weight:800;cursor:pointer}
details.more .long{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.q{display:flex;flex-direction:column;gap:10px}
.qjp{font-family:var(--f-jp);font-size:clamp(30px,9vw,48px);font-weight:700;line-height:1.9}
.qtxt{font-family:var(--f-jp);font-size:20px;font-weight:500;line-height:2.1}
.opts{display:grid;gap:10px;grid-template-columns:1fr}
.opts.short{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;min-height:48px;border-radius:14px;border:2.5px solid var(--edge);background:var(--surface);box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:16px}
.opt .jp{font-size:19px}
.opts.short .opt{justify-content:center;font-size:22px;font-family:var(--f-jp)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.opt.right{background:var(--mint);color:var(--mint-i)}
.opt.wrong{background:var(--pink);color:var(--pink-i)}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.fb{border-radius:14px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--mint);color:var(--mint-i)}
.fb.no{background:var(--pink);color:var(--pink-i)}
.fb .ic{margin-top:3px}
.pn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* kartu */
.fcard{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px 16px;cursor:pointer;width:100%}
.fc-jp{font-family:var(--f-jp);font-size:clamp(40px,13vw,76px);font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.fc-kana{font-family:var(--f-jp);font-size:clamp(22px,6vw,30px);font-weight:700;color:var(--orange-i)}
.fc-mean{font-family:var(--f-d);font-size:clamp(24px,7vw,34px);font-weight:800;line-height:1.2}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rate .btn{flex-direction:column;gap:0;line-height:1.2;padding:8px 6px}
.rate small{font-weight:700;font-size:12px;opacity:.85}
.fcfilter{display:flex;gap:8px;flex-wrap:wrap}
.fil{padding:6px 12px;border-radius:999px;border:2px solid var(--edge);background:var(--surface);font-weight:800;font-size:14px}
.fil[aria-pressed="true"]{background:var(--orange);color:var(--onorange)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.stats b{display:block;font-family:var(--f-d);font-size:30px;line-height:1.1}
.stats span{font-size:13px;font-weight:700;color:var(--ink2)}

/* kuis */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.qlab{font-weight:800;color:var(--ink2)}
.pool,.ansarea{display:flex;flex-wrap:wrap;gap:8px}
.ansarea{min-height:62px;padding:10px;border:2.5px dashed var(--line);border-radius:14px;background:var(--surface2);align-content:flex-start}
.tk{padding:8px 12px;border-radius:12px;border:2.5px solid var(--edge);background:var(--surface);font-family:var(--f-jp);font-weight:700;font-size:19px;box-shadow:0 3px 0 var(--edge)}
.tk:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.blank{display:inline-block;min-width:1.6em;padding:0 .35em;border-radius:8px;background:var(--lemon);color:var(--lemon-i);text-align:center;font-weight:700;line-height:1.5}
.blank.right{background:var(--mint);color:var(--mint-i)}
.blank.wrong{background:var(--pink);color:var(--pink-i)}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.result b{font-family:var(--f-d);font-size:48px;line-height:1}

/* referensi */
.search{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:14px;border:2.5px solid var(--edge);background:var(--surface);box-shadow:0 4px 0 var(--edge)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:17px;padding:12px 0;outline:0}
.search:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.sum{display:flex;flex-direction:column;gap:12px}
.sum header{display:flex;gap:12px;align-items:center}
.sum .ex .jp{font-size:18px;line-height:2}
.vrow{display:grid;grid-template-columns:minmax(90px,.9fr) minmax(0,1.6fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:2px dashed var(--line)}
.vrow:first-child{border-top:0}
.vrow .jp{font-size:22px;font-weight:700;line-height:1.9}
.vrow .small{display:block}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:300px}
th,td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
td.jp{font-size:18px}
.empty{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 8px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;max-width:min(92vw,420px);background:var(--edge);color:#fff;
  padding:10px 16px;border-radius:14px;font-weight:800;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25)}
@media (min-width:880px){.toast{bottom:28px}}
@media (max-width:480px){
  .vrow{grid-template-columns:minmax(0,1fr) auto auto}
  .vrow .mean{grid-column:1/-1;grid-row:2}
  .opts.short{grid-template-columns:1fr 1fr}
  .brand span{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  {q:'「これは {本|ほん}です。」 artinya?',o:['Ini adalah buku.','Itu bukan buku.','Ini buku apa?','Buku itu milik saya.'],a:0,w:'これ = ini, 本 = buku, です = adalah.'},
  {q:'は dibaca bagaimana saat menjadi partikel?',o:['ha','wa','o','e'],a:1,w:'Partikel は dibaca "wa".'}]},
{id:2,mark:'じゃ',title:'ではありません',sub:'Bentuk "bukan"',
 inti:'Bentuk tidak dari です. Pilihannya ではありません (paling formal), じゃありません, dan じゃないです (paling santai).',
 rumus:[[['KB1','n'],['は','p'],['KB2 / KS','n'],['ではありません','e']],[['atau','n'],['じゃありません','e'],['じゃないです','e']]],
 ex:[['{彼|かれ}は {先生|せんせい}ではありません。','Dia (laki-laki) bukan guru.'],['{明日|あした}は {日曜日|にちようび}じゃありません。','Besok bukan hari Minggu.'],['{彼|かれ}は ジュリオさんじゃないです。','Dia bukan Julio.']],
 warn:'Jangan menulis 「{学生|がくせい}ないです」. Bentuk tidak dari です selalu memakai では atau じゃ di depannya.',
 trick:'では → じゃ: lidah malas jadi lebih pendek. ありません → ないです juga lebih santai. Makin pendek, makin santai.',
 note:'Di PDF, contoh kedua berbunyi 「これは ブラジル人じゃありません」 (Ini bukan orang Brasil). Kuganti dengan 「彼は …」 karena これ biasanya dipakai untuk benda.',
 long:'<p>Pola: KB1 は KB2 / KS ではありません / じゃありません / じゃないです.</p>',
 q:[
  {q:'{彼|かれ}は {先生|せんせい}＿＿。 (bukan guru)',o:['ではありません','ありません','ないます','ですない'],a:0,w:'Bentuk tidak dari です adalah ではありません.'},
  {q:'「{明日|あした}は {日曜日|にちようび}じゃありません。」 artinya?',o:['Besok bukan hari Minggu.','Besok hari Minggu.','Kemarin bukan hari Minggu.','Besok hari Senin.'],a:0,w:'じゃありません = bukan.'},
  {q:'Mana yang paling santai?',o:['じゃないです','ではありません','じゃありません'],a:0,w:'Dari formal ke santai: ではありません, じゃありません, じゃないです.'}]},
{id:3,mark:'か',title:'か',sub:'Kalimat tanya',
 inti:'Tambahkan か di akhir kalimat untuk bertanya. Tanda tanya (？) boleh dipakai, tetapi tidak wajib.',
 rumus:[[['KB1','n'],['は','p'],['KB2 / KS','n'],['です','e'],['か','p']],[['何 / どこ / だれ','q'],['ですか','e']]],
 ex:[['それは {何|なん}ですか。','Itu apa?'],['お{国|くに}は どこですか。','Negaranya di mana?'],['{日本語|にほんご}は {面白|おもしろ}いですか。','Apakah bahasa Jepang menarik?']],
 warn:'{何|なに} dibaca なん sebelum です atau の. Jadi 「何ですか」 dibaca "nan desu ka", bukan "nani desu ka".',
 trick:'か = "kah" dalam bahasa Indonesia! Itu-kah? Apa-kah? Bunyinya saja sudah mirip.',
 long:'<p>か adalah partikel penanda kalimat tanya yang diletakkan di akhir kalimat. Contoh lain: お{名前|なまえ}は {何|なん}ですか。 (Namanya apa? / Namanya siapa?)</p>',
 q:[
  {q:'これは {本|ほん}です＿＿。 (Apakah ini buku?)',o:['か','も','の','を'],a:0,w:'か di akhir kalimat membuatnya jadi pertanyaan.'},
  {q:'「お{国|くに}は どこですか。」 artinya?',o:['Negaranya di mana?','Negaranya apa?','Anda siapa?','Ini di mana?'],a:0,w:'どこ = di mana.'},
  {q:'「何ですか」 dibaca bagaimana?',o:['なんですか','なにですか','なかですか','なのですか'],a:0,w:'何 menjadi なん sebelum です.'}]},
{id:4,mark:'も',title:'も',sub:'Juga',
 inti:'も = "juga". Pakai も menggantikan は kalau isi kalimatnya sama dengan kalimat sebelumnya.',
 rumus:[[['KB1','n'],['は','p'],['KB2','n'],['です','e']],[['KB3','n'],['も','p'],['KB2','n'],['です','e']]],
 ex:[['{私|わたし}は {学生|がくせい}です。{彼|かれ}も {学生|がくせい}です。','Saya adalah siswa. Dia juga siswa.'],['アリンさんも {会社員|かいしゃいん}です。','Arin juga karyawan perusahaan.'],['{明日|あした}も {晴|は}れです。','Besok juga cerah.']],
 warn:'も menggantikan は, bukan ditumpuk. Salah: 「{彼|かれ}はも …」. Untuk "juga tidak", cukup も + bentuk negatif: 「{彼|かれ}も {学生|がくせい}ではありません」.',
 trick:'Ingat nama maskotnya: Mo-mo. Kalau Momo ikut-ikutan, dia bilang 「モモも！」 (Momo juga!).',
 long:'<p>も menunjukkan predikat yang sama dengan konteks sebelumnya ("juga", "pun"). Bisa dipakai dengan です maupun kata kerja ます.</p><p>Contoh: {友達|ともだち}も {来|き}ます。 (Teman juga datang.)</p>',
 q:[
  {q:'ミラーさんは {医者|いしゃ}です。サントスさん＿＿ {医者|いしゃ}です。',tr:'Santos juga dokter.',o:['も','は','の','を'],a:0,w:'Kata "juga" = も.'},
  {q:'「アリンさんも {会社員|かいしゃいん}です。」 artinya?',o:['Arin juga karyawan perusahaan.','Arin bukan karyawan.','Arin adalah karyawan.','Arin dan karyawan.'],a:0,w:'も = juga.'},
  {q:'Cara mengatakan "Kamu juga guru."',o:['あなたも {先生|せんせい}です。','あなたは {先生|せんせい}です。','あなたの {先生|せんせい}です。','あなたと {先生|せんせい}です。'],a:0,w:'Ganti は dengan も.'}]},
{id:5,mark:'の',title:'の',sub:'Milik / tentang',
 inti:'A の B = B yang terkait dengan A (milik A, tentang A, asal A). の menyambung dua kata benda.',
 rumus:[[['KB1','n'],['の','p'],['KB2','n']]],
 ex:[['{私|わたし}の {手帳|てちょう}です。','Ini buku agenda milik saya.'],['これは コンピューターの {雑誌|ざっし}です。','Ini majalah (tentang) komputer.'],['ミラーさんの {車|くるま}は ドイツの {車|くるま}です。','Mobil Miller adalah mobil (buatan) Jerman.']],
 warn:'Urutannya terbalik dari bahasa Indonesia: "buku saya" menjadi 「{私|わたし}の {本|ほん}」 (saya-の-buku). の tidak selalu berarti "milik", artinya mengikuti konteks.',
 trick:'の seperti \'s dalam bahasa Inggris: Momo\'s cat = モモの {猫|ねこ}. Baca dari depan: "Momo-nya kucing".',
 long:'<p>の menunjukkan kepemilikan (KB1 pemilik, KB2 yang dimiliki) dan juga hal yang terkait atau tentang KB1.</p><p>ドイツの {車|くるま} secara harfiah "mobil milik Jerman", tetapi dari konteks lebih tepat "mobil buatan/asal Jerman".</p>',
 q:[
  {q:'これは {私|わたし}＿＿ {鍵|かぎ}です。',tr:'Ini kunci milik saya.',o:['の','は','を','も'],a:0,w:'Pemilik + の + benda.'},
  {q:'"Ini majalah komputer." dalam bahasa Jepang:',o:['これは コンピューターの {雑誌|ざっし}です。','これは {雑誌|ざっし}の コンピューターです。','これは コンピューターは {雑誌|ざっし}です。','これは コンピューターを {雑誌|ざっし}です。'],a:0,w:'Kata yang menerangkan ditaruh di depan の.'},
  {q:'"Buku milik guru" =',o:['{先生|せんせい}の {本|ほん}','{本|ほん}の {先生|せんせい}','{先生|せんせい}は {本|ほん}','{本|ほん}は {先生|せんせい}'],a:0,w:'Pemilik di depan, の, lalu bendanya.'}]},
{id:6,mark:'で',title:'で (tempat)',sub:'Melakukan sesuatu di ...',
 inti:'Tempat + で + kata kerja = melakukan sesuatu di tempat itu.',
 rumus:[[['KB tempat','n'],['で','p'],['KK ます / ません','v']]],
 ex:[['{会社|かいしゃ}で {働|はたら}きます。','Bekerja di perusahaan.'],['{学校|がっこう}で {勉強|べんきょう}します。','Belajar di sekolah.'],['うちで {休|やす}みません。','Tidak beristirahat di rumah.']],
 warn:'で menandai tempat kegiatan berlangsung. Jangan tertukar dengan に (tempat keberadaan atau tujuan) yang dibahas di Pelajaran 2.',
 trick:'で ≈ "di" (de → di). Tempat + で = "di tempat itu, ada aksi". Momo: 「{学校|がっこう}で {勉強|べんきょう}します」 = Momo belajar di sekolah ninja.',
 long:'<p>Pola: KB (tempat) で KK ます / ません. Contoh lain: スーパーで {買|か}いません。 (Tidak membeli di supermarket.)</p>',
 q:[
  {q:'{学校|がっこう}＿＿ {勉強|べんきょう}します。',tr:'Belajar di sekolah.',o:['で','を','は','の'],a:0,w:'で = di (tempat kegiatan).'},
  {q:'「{会社|かいしゃ}で {働|はたら}きます。」 artinya?',o:['Bekerja di perusahaan.','Pergi ke perusahaan.','Perusahaan bekerja.','Perusahaan saya.'],a:0,w:'会社で = di perusahaan, 働きます = bekerja.'},
  {q:'"Tidak beristirahat di rumah." =',o:['うちで {休|やす}みません。','うちで {休|やす}みます。','うちを {休|やす}みません。','うちの {休|やす}みません。'],a:0,w:'で + kata kerja bentuk ません (tidak).'}]},
{id:7,mark:'で',title:'で (jumlah)',sub:'Total / seharga',
 inti:'Jumlah atau uang + で = "dengan total", "seharga sekian".',
 rumus:[[['jumlah / uang','n'],['で','p'],['KK / です','v']]],
 ex:[['ぜんぶで ５００{円|えん}です。','Totalnya 500 yen.'],['コーヒーは {百円|ひゃくえん}で {買|か}います。','Beli kopi seharga 100 yen.'],['パンと ケーキは ぜんぶで ３００{円|えん}です。','Roti dan kue totalnya 300 yen.']],
 warn:'Bedakan dengan で tempat dan で alat dengan melihat kata di depannya. Kalau angka, uang, atau 「ぜんぶ」, itu で jumlah.',
 trick:'Bayangkan kasir Momo menekan tombol total: 「ぜんぶ-で！」 (semuanya jadi ...). で di sini = "dengan jumlah".',
 note:'Dua contoh di PDF (「ラーメンは 全部で 食べます」 dan 「仕事は 8時間で します」) terasa janggal dan artinya kurang jelas, jadi kuganti dengan contoh harga. Cek ke sensei kalau mau memastikan.',
 long:'<p>Penjelasan PDF: で juga menunjukkan jumlah dari kata benda yang dipakai.</p>',
 q:[
  {q:'ぜんぶ＿＿ ３００{円|えん}です。',tr:'Totalnya 300 yen.',o:['で','を','の','か'],a:0,w:'ぜんぶで = total semuanya.'},
  {q:'「ぜんぶで {五百円|ごひゃくえん}です。」 artinya?',o:['Totalnya 500 yen.','Satu buah 500 yen.','Saya punya 500 yen.','Besok 500 yen.'],a:0,w:'ぜんぶで = total, 五百円 = 500 yen.'},
  {q:'{百円|ひゃくえん}＿＿ コーヒーを {買|か}います。',tr:'Beli kopi seharga 100 yen.',o:['で','を','の','は'],a:0,w:'Uang + で = seharga.'}]},
{id:8,mark:'で',title:'で (alat / bahan)',sub:'Dengan / memakai ...',
 inti:'Alat, sarana, bahan, atau bahasa + で + kata kerja = melakukan dengan itu.',
 rumus:[[['KB alat / bahan / bahasa','n'],['で','p'],['KK ます / ません','v']]],
 ex:[['{手|て}で {食|た}べます。','Makan dengan tangan.'],['{英語|えいご}で {書|か}きます。','Menulis dalam bahasa Inggris.'],['ストローで {飲|の}みません。','Tidak minum dengan sedotan.']],
 warn:'Untuk "dengan (orang)" jangan pakai で, pakai と. で hanya untuk alat, bahan, dan bahasa.',
 trick:'で = "pakai". {手|て}で = pakai tangan. Momo melempar shuriken: 「しゅりけんで！」 (pakai shuriken).',
 long:'<p>Pola: KB (alat, sarana, bahan) で KK ます / ません. Contoh lain: {肉|にく}で {作|つく}りません。 (Tidak membuat dengan daging.)</p>',
 q:[
  {q:'{手|て}＿＿ {食|た}べます。',tr:'Makan dengan tangan.',o:['で','を','の','は'],a:0,w:'Alat + で = dengan.'},
  {q:'「{英語|えいご}で {書|か}きます。」 artinya?',o:['Menulis dalam bahasa Inggris.','Belajar bahasa Inggris.','Membaca buku Inggris.','Berbicara dengan orang Inggris.'],a:0,w:'Bahasa + で = dalam bahasa itu.'},
  {q:'"Makan dengan sendok" =',o:['スプーンで {食|た}べます。','スプーンを {食|た}べます。','スプーンと {食|た}べます。','スプーンの {食|た}べます。'],a:0,w:'Alat + で.'}]},
{id:9,mark:'を',title:'を',sub:'Penanda objek',
 inti:'を menandai benda yang dikenai tindakan (yang dimakan, diminum, dibuka).',
 rumus:[[['KB','n'],['を','p'],['KK ます / ません','v']]],
 ex:[['ジュースを {飲|の}みます。','Minum jus.'],['{明日|あした}は ご{飯|はん}を {食|た}べません。','Besok tidak makan nasi.'],['ピアノを {弾|ひ}きます。','Bermain piano.']],
 warn:'を dibaca "o", bukan "wo". Bahasa Indonesia tidak punya penanda objek, tetapi dalam bahasa Jepang objek umumnya diberi を.',
 trick:'を = "o". Momo: 「おにぎりを {食|た}べます」, "onigiri o tabemasu". Ada dua "o" berdekatan, mudah diingat.',
 long:'<p>Pola: KB を KK ます / ません. Contoh lain: ドアを {開|あ}けます。 (Membuka pintu.)</p>',
 q:[
  {q:'ジュース＿＿ {飲|の}みます。',tr:'Minum jus.',o:['を','で','の','と'],a:0,w:'Benda yang diminum ditandai を.'},
  {q:'Partikel を dibaca ...',o:['o','wo','wa','e'],a:0,w:'Sebagai partikel, を dibaca "o".'},
  {q:'「ご{飯|はん}を {食|た}べません。」 artinya?',o:['Tidak makan nasi.','Makan nasi.','Mau makan nasi.','Sudah makan nasi.'],a:0,w:'ません = tidak.'}]},
{id:10,mark:'と',title:'と',sub:'Dan (lengkap)',
 inti:'A と B = "A dan B". Semua benda disebut lengkap, tidak ada yang tertinggal.',
 rumus:[[['KB1','n'],['と','p'],['KB2','n'],['～です','e']]],
 ex:[['シスカさんと アディさんは {友達|ともだち}です。','Siska dan Adi adalah teman.'],['フォークと スプーンで {食|た}べますか。','Apakah makan dengan garpu dan sendok?'],['{銀行|ぎんこう}の {休|やす}みは {土曜日|どようび}と {日曜日|にちようび}です。','Libur bank adalah Sabtu dan Minggu.']],
 warn:'と dipakai untuk daftar yang lengkap. Kalau cuma contoh dan masih ada yang lain, pakai や. と juga hanya menyambung kata benda.',
 trick:'Anggap と sebagai tanda "+": A + B, semuanya disebut. Momo: 「おにぎりと おちゃ」 = onigiri dan teh, hanya itu.',
 long:'<p>と penggunaannya mirip daftar: kata benda tidak harus satu kategori, tetapi harus disebut semuanya secara berurutan. Contoh: たまごと りんごと マンゴです (telur, apel, dan mangga).</p>',
 q:[
  {q:'{土曜日|どようび}＿＿ {日曜日|にちようび}です。 (hanya dua hari itu)',o:['と','や','の','を'],a:0,w:'Daftar lengkap = と.'},
  {q:'「フォークと スプーンで ...」, と di sini artinya?',o:['dan','dengan (orang)','di','milik'],a:0,w:'と menyambung dua benda: garpu dan sendok.'},
  {q:'"Roti dan kue" (hanya dua itu) =',o:['パンと ケーキ','パンや ケーキ','パンの ケーキ','パンを ケーキ'],a:0,w:'Daftar lengkap = と.'}]},
{id:11,mark:'や',title:'や ・ など',sub:'Dan sebagainya',
 inti:'A や B (など) = "A, B, dan sebagainya". Hanya menyebut contoh, masih ada yang lain.',
 rumus:[[['KB1','n'],['や','p'],['KB2','n'],['(など)','p'],['～です','e']]],
 ex:[['りんごや マンゴ(など)は {果物|くだもの}です。','Apel, mangga (dan sebagainya) adalah buah.'],['{東京|とうきょう}や {京都|きょうと}などは {日本|にほん}の {町|まち}です。','Tokyo, Kyoto, dan sebagainya adalah kota di Jepang.'],['コーヒーや お{茶|ちゃ}や ジュースなどは {飲|の}み{物|もの}です。','Kopi, teh, jus, dan sebagainya adalah minuman.']],
 warn:'や hanya untuk benda dalam satu kelompok yang sama. Apel dan mangga cocok (buah); apel dan buku tidak cocok. Untuk daftar lengkap, pakai と.',
 trick:'や terdengar seperti "yaa, misalnya ...": apel yaa, mangga yaa, dan lain-lain. Nada menggantung = daftar belum selesai.',
 long:'<p>「や」 menggabungkan dua kata benda atau lebih sebagai wakil dari satu kelompok. 「など」 berarti harfiah "dan sebagainya" atau "dan lain-lain".</p>',
 q:[
  {q:'りんご＿＿ マンゴなどは {果物|くだもの}です。',tr:'Apel, mangga, dan sebagainya adalah buah.',o:['や','を','で','の'],a:0,w:'や = contoh dari satu kelompok.'},
  {q:'「など」 artinya?',o:['dan sebagainya','dan','juga','dengan'],a:0,w:'など = dan sebagainya / dan lain-lain.'},
  {q:'「{東京|とうきょう}や {京都|きょうと}などは {日本|にほん}の {町|まち}です。」 artinya?',o:['Tokyo, Kyoto, dan sebagainya adalah kota di Jepang.','Tokyo dan Kyoto saja adalah kota Jepang.','Tokyo bukan kota Jepang.','Kota Jepang adalah Tokyo.'],a:0,w:'や ... など = contoh, masih ada yang lain.'}]},
{id:12,les:2,mark:'た',title:'ました ・ ませんでした',sub:'Bentuk lampau',
 inti:'Untuk masa lalu, ganti ます menjadi ました. Bentuk tidaknya ませんでした. Untuk です, bentuk lampaunya でした.',
 rumus:[[['KK','v'],['ました','e']],[['KK','v'],['ませんでした','e']],[['KB','n'],['でした','e']]],
 ex:[['{昨日|きのう} {私|わたし}は カレーを {食|た}べました。','Kemarin saya makan kare.'],['おととい、パンを {買|か}いませんでした。','Kemarin lusa saya tidak membeli roti.'],['{昨日|きのう}は {休|やす}みでした。','Kemarin libur.']],
 warn:'Bentuk lampau jarang berdiri sendiri. Biasanya ada kata waktu seperti きのう, おととい, けさ, せんしゅう. Lampau negatif dari です adalah ではありませんでした atau じゃなかったです.',
 trick:'Tiga pasangan: ます → ました, ません → ませんでした, です → でした. Ujungnya selalu berubah jadi 「ました」 atau 「でした」.',
 note:'Di PDF, bentuk lampau negatif です tertulis 「じゃないでした」. Bentuk itu tidak dipakai. Yang benar 「じゃなかったです」 atau 「ではありませんでした」. Contoh PDF no. 2 dan 3 juga bukan bentuk lampau, jadi contoh ketiga di atas dari Momo.',
 long:'<p>Kata kerja: ～ます → ～ました (sudah), ～ません → ～ませんでした (tidak, di masa lalu).</p><p>Kata benda dan です: ～です → ～でした, ～ではありません → ～ではありませんでした.</p><p>Kata penanda: {昨日|きのう} kemarin, {先週|せんしゅう} minggu lalu, {先月|せんげつ} bulan lalu, {去年|きょねん} tahun lalu, もう sudah, まだ belum.</p>',
 q:[{q:'{昨日|きのう} {私|わたし}は カレーを {食|た}べ＿＿。',tr:'Kemarin saya makan kare.',o:['ました','ます','ません','ませんでした'],a:0,w:'Lampau positif: ～ました.'},
  {q:'おととい、パンを {買|か}い＿＿。',tr:'Kemarin lusa saya tidak membeli roti.',o:['ませんでした','ました','ません','ます'],a:0,w:'Lampau negatif: ～ませんでした.'},
  {q:'「{昨日|きのう}は {休|やす}みでした。」 artinya?',o:['Kemarin libur.','Kemarin tidak libur.','Besok libur.','Hari ini libur.'],a:0,w:'でした = lampau dari です.'}]},
{id:13,les:2,mark:'へ',title:'へ いきます',sub:'Arah gerakan',
 inti:'へ menunjukkan arah gerakan. Kata kerja yang dipakai terbatas: いきます, きます, かえります, もどります.',
 rumus:[[['KB tempat','n'],['へ','p'],['行きます / 来ます / 帰ります / 戻ります','v']]],
 ex:[['こちらへ {来|き}ます。','Datang ke sini.'],['{会社|かいしゃ}へ {戻|もど}りません。','Tidak kembali ke perusahaan.'],['うちへ {帰|かえ}りました。','Pulang ke rumah (sendiri).'],['どこへ {行|い}きますか。','Pergi ke mana?']],
 warn:'へ ditulis "he", tapi sebagai partikel dibaca "e". Hanya dipakai dengan kata kerja gerakan.',
 trick:'Bentuk へ mirip kepala anak panah. Anak panah menunjuk ke arah tujuan.',

const KEY='momo-nihongo-v1';
let S={xp:0,streak:0,last:'',day:'',cnt:0,goalDay:'',cards:{},stars:{},hard:{},furi:true,pdone:{}};
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&typeof o==='object')S=Object.assign(S,o)}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function rollover(){const t=today();if(S.day!==t){S.day=t;S.cnt=0}}
function curStreak(){return(S.last===today()||S.last===yest())?S.streak:0}
function award(xp,n){
  rollover();S.xp+=xp;S.cnt+=(n===undefined?1:n);
  const t=today();
  if(S.last!==t){S.streak=(S.last===yest()?S.streak:0)+1;S.last=t}
  if(S.cnt>=GOAL&&S.goalDay!==t){S.goalDay=t;S.xp+=30;toast('Target harian tercapai! +30 XP')}
  save();chips();
}
let toastT=null;

function speak(t){
  try{
    if(!('speechSynthesis' in window)){toast('Suara tidak tersedia di browser ini.');return}
    const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;
    const vs=speechSynthesis.getVoices();const jv=vs.find(v=>/^ja/i.test(v.lang));
    if(jv)u.voice=jv;else if(vs.length)toast('Suara bahasa Jepang belum terpasang di perangkat ini.');
    speechSynthesis.cancel();speechSynthesis.speak(u);
  }catch(e){toast('Suara tidak bisa diputar.')}
}

function cardIds(f,deck){
  if(deck==='k')return KJ.map(k=>'k:'+k.k).filter(id=>f==='all'||(f==='hard'?S.hard[id]:('b'+KB[id].b)===f));

  const rd='<span class="small"><b>Kun</b> '+esc(kj.kun.join('、')||'-')+' &nbsp; <b>On</b> '+esc(kj.on.join('、')||'-')+'</span>';
  const front='<div class="fc-jp" lang="ja">'+esc(kj.k)+'</div>'+(flip?'':'<div class="small muted jp fr">Kun: '+esc(kj.kun.join('、')||'-')+' · On: '+esc(kj.on.join('、')||'-')+'</div><p class="muted small">Ketuk kartu untuk melihat arti</p>');
  if(!flip)return front;
  const ex=kj.ex.slice(0,4).map(x=>'<div class="jp" lang="ja" style="font-size:18px;line-height:2.1;font-weight:500">'+rb(x[0])+' <span class="muted small" style="font-family:var(--f-b)">'+esc(x[1])+'</span></div>').join('');
  return front+'<div class="fc-mean">'+esc(kj.m)+'</div><div class="jp" lang="ja">'+rd+'</div>'+(ex?'<div style="margin-top:4px">'+ex+'</div>':'')+'<span class="tag c-sky">Bab '+kj.b+'</span>';
}
function fcQueue(f,deck){
  const now=Date.now();
  const ids=cardIds(f,deck||'v');
  const due=ids.filter(id=>S.cards[id]&&S.cards[id].d<=now).sort((a,b)=>S.cards[a].d-S.cards[b].d);
  const fresh=ids.filter(id=>!S.cards[id]);
  return{due,fresh,total:ids.length};
}

/* ---- kuis ---- */
function qMeaning(v){
  const pool=shuf(QV.filter(x=>x.id!==v.id&&x.mean!==v.mean));
  const same=pool.filter(x=>x.cat===v.cat),rest=pool.filter(x=>x.cat!==v.cat);
  const seen={};seen[v.mean]=1;const pk=[];
  same.concat(rest).forEach(x=>{if(pk.length<3&&!seen[x.mean]){seen[x.mean]=1;pk.push(x.mean)}});
  const o=shuf([v.mean].concat(pk));
  return{t:'mcq',vid:v.id,prompt:'<div class="qjp" lang="ja">'+vrb(v)+'</div><div class="qlab">Apa artinya?</div>',o:o,a:o.indexOf(v.mean),why:'<span class="jp">'+esc(v.jp)+'</span> ('+esc(v.kana)+') = '+esc(v.mean)+'.'+(v.note?' '+esc(v.note):''),link:{k:'v',q:v.jp}};
}
function qReading(v){
  const pool=shuf(QV.filter(x=>x.id!==v.id&&x.jp!==x.kana&&x.kana!==v.kana));
  const seen={};seen[v.kana]=1;const pk=[];
  pool.forEach(x=>{if(pk.length<3&&!seen[x.kana]){seen[x.kana]=1;pk.push(x.kana)}});
  const o=shuf([v.kana].concat(pk));
  return{t:'mcq',vid:v.id,prompt:'<div class="qjp" lang="ja">'+esc(v.jp)+'</div><div class="qlab">Bagaimana cara bacanya?</div>',o:o,a:o.indexOf(v.kana),jpo:true,why:'<span class="jp">'+esc(v.jp)+'</span> dibaca <span class="jp">'+esc(v.kana)+'</span>, artinya '+esc(v.mean)+'.',link:{k:'v',q:v.jp}};
}

function qOrder(x){return{t:'ord',tk:x.tk,tr:x.tr,link:{k:'p',p:x.p}}}
let KP=null;
function kanaPool(){
  if(!KP){KP=[];const add=x=>{if(x)KP.push({h:x[0],r:x[1]})};KANA.b.forEach(r=>r.forEach(add));KANA.d.forEach(r=>r.forEach(add));KANA.y.forEach(add);
    const cnt={};KP.forEach(x=>{cnt[x.r]=(cnt[x.r]||0)+1});KP.forEach(x=>{x.u=cnt[x.r]===1})}
  return KP;
}
const toKata=c=>[...c].map(ch=>/[ぁ-ゖ]/.test(ch)?String.fromCharCode(ch.charCodeAt(0)+96):ch).join('');
function qKana(x,mode){
  const kt=mode==='kata',cv=t=>kt?toKata(t):t,ch=cv(x.h),pool=shuf(kanaPool());
  const link={k:'kana',m:kt?'k':'h'};
  if(x.u&&Math.random()<.35){
    const wr=pool.filter(y=>y.h!==x.h).slice(0,3).map(y=>cv(y.h)),o=shuf([ch].concat(wr));
    return{t:'mcq',prompt:'<div class="qjp" lang="en">'+esc(x.r)+'</div><div class="qlab">Huruf '+(kt?'katakana':'hiragana')+' yang mana?</div>',o:o,a:o.indexOf(ch),jpo:true,why:'<span class="jp">'+ch+'</span> dibaca '+esc(x.r)+'.',link:link};
  }
  const seen={};seen[x.r]=1;const wr=[];
  pool.forEach(y=>{if(wr.length<3&&!seen[y.r]){seen[y.r]=1;wr.push(y.r)}});
  const o=shuf([x.r].concat(wr));
  return{t:'mcq',prompt:'<div class="qjp" lang="ja">'+ch+'</div><div class="qlab">Bagaimana cara bacanya?</div>',o:o,a:o.indexOf(x.r),why:'<span class="jp">'+ch+'</span> dibaca '+esc(x.r)+'.',link:link};
}

const TEF={'って':'った','んで':'んだ','いて':'いた','いで':'いだ','して':'した'};
const KQF={masu:'ます (sopan)',nai:'ない (negatif)',te:'て',ta:'た (lampau)'};
function qUniq(arr,ok){const s={};s[ok]=1;return arr.filter(function(x){if(s[x])return false;s[x]=1;return true})}
function qConj(w){
  const g=w.g,d=w.r,st=d.slice(0,-1),L=d.slice(-1),f=kconj(d,g);
  const form=['masu','nai','te','ta'][Math.floor(Math.random()*4)];
  const sfx=form==='masu'?'ます':'ない',ok=f[form];let wr=[];
  if(form==='te'||form==='ta'){['って','んで','いて','いで','して'].forEach(function(e){wr.push(st+(form==='ta'?TEF[e]:e))})}
  else if(g===1){KROWS[L].split('').forEach(function(c){wr.push(st+c+sfx)});wr.push(d+sfx)}
  else if(g===2){wr=[d+sfx,st+'ら'+sfx,st+'り'+sfx,st+'れ'+sfx]}
  else{const b=d.slice(0,-2);
    if(/くる$/.test(d))wr=form==='masu'?[b+'くます',b+'こます',b+'くるます']:[b+'くない',b+'きない',b+'くらない'];
    else wr=form==='masu'?[b+'すます',b+'さます',b+'せます',d+'ます']:[b+'すない',b+'さない',b+'せない',d+'ない']}
  wr=qUniq(wr,ok);
  if(wr.length<3)wr=wr.concat(qUniq([f.masen,f.mashita,f.nakatta,f.tai].filter(function(x){return wr.indexOf(x)<0}),ok));
  wr=shuf(wr).slice(0,3);
  const o=shuf([ok].concat(wr));
  const kn='<span class="jp">'+(w.k!==w.r?'<ruby>'+esc(w.k)+'<rt>'+esc(w.r)+'</rt></ruby>':esc(w.k))+'</span>',an='<span class="jp">'+esc(ok)+'</span>';

  else if((form==='te'||form==='ta')&&/(行く|いく)$/.test(d))why=kn+' pengecualian: '+an+' (bukan '+st+(form==='ta'?'いた':'いて')+').';

  else why=kn+' kelompok 1: '+L+' → '+(L==='う'&&form==='nai'?'わ':KROWS[L][form==='masu'?1:0])+' + '+sfx+'. Hasilnya '+an+'.';

function mkQuiz(mode,n){
  let qs=[];
  const vq=vs=>vs.map((v,i)=>(v.jp!==v.kana&&i%3===2)?qReading(v):qMeaning(v));
  if(mode==='mix'){const np=Math.min(PQ.length,Math.round(n*.3)),no=Math.min(OQ.length,Math.round(n*.2));qs=vq(pickVocab(n-np-no)).concat(shuf(PQ).slice(0,np).map(qParticle)).concat(shuf(OQ).slice(0,no).map(qOrder))}
  else if(mode==='vocab')qs=vq(pickVocab(n));
  else if(mode==='partikel')qs=shuf(PQ).slice(0,n).map(qParticle);
  else if(mode==='susun')qs=shuf(OQ).slice(0,n).map(qOrder);
  else if(mode==='konj')qs=cyc(KK,n).map(qConj);
  else if(mode==='hira'||mode==='kata')qs=cyc(kanaPool(),n).map(x=>qKana(x,mode));
  else if(mode==='isian')qs=shuf(FQ).slice(0,n).map(qFill);
  else if(mode==='tabel')qs=shuf(TQ).slice(0,n).map(qTbl);
  else if(mode==='kanji'){for(let i=0;i<n;i++)qs.push(qKanji())}
  else if(mode==='angka')qs=cyc(ANQ,n).map(qAngka);
  else if(mode==='sulit')qs=vq(pickVocab(n,true));
  return shuf(qs);
}

function kconj(d,g){
  var GR={'う':['わ','い'],'く':['か','き'],'ぐ':['が','ぎ'],'す':['さ','し'],'つ':['た','ち'],'ぬ':['な','に'],'ぶ':['ば','び'],'む':['ま','み'],'る':['ら','り']};
  var L=d.slice(-1),st=d.slice(0,-1),m,n,te,ta,tai;
  if(g===3){
    if(/(来る|くる)$/.test(d)){var kn=d.endsWith('くる'),P=d.slice(0,-2),ki=kn?'き':'来',ko=kn?'こ':'来';m=P+ki+'ます';n=P+ko+'ない';te=P+ki+'て';ta=P+ki+'た';tai=P+ki+'たい'}
    else{var Q=d.slice(0,-2);m=Q+'します';n=Q+'しない';te=Q+'して';ta=Q+'した';tai=Q+'したい'}
  }else if(g===2){m=st+'ます';n=st+'ない';te=st+'て';ta=st+'た';tai=st+'たい'}
  else{
    var r=GR[L],c1,c2;
    if(/(行く|いく)$/.test(d)||'うつる'.indexOf(L)>=0){c1='って';c2='った'}
    else if('むぶぬ'.indexOf(L)>=0){c1='んで';c2='んだ'}
    else if(L==='く'){c1='いて';c2='いた'}
    else if(L==='ぐ'){c1='いで';c2='いだ'}
    else{c1='して';c2='した'}
    m=st+r[1]+'ます';n=d==='ある'?'ない':st+r[0]+'ない';te=st+c1;ta=st+c2;tai=st+r[1]+'たい';
  }
  return{dict:d,masu:m,masen:m.replace(/ます$/,'ません'),mashita:m.replace(/ます$/,'ました'),masendeshita:m.replace(/ます$/,'ませんでした'),nai:n,nakatta:n.replace(/ない$/,'なかった'),ta:ta,te:te,tai:tai,takunai:tai.replace(/たい$/,'たくない')};
}

function kkRules(){

  const w=function(h,t){return '<div class="callout c-lemon"><div>'+ic('bulb')+'</div><div class="small">'+h+'</div></div>'};
  const s1=sec('1. Apa itu perubahan bentuk?','<p>Kata kerja Jepang tidak berdiri sendiri seperti di bahasa Indonesia. <b>Akhirannya berubah</b> tergantung maksudnya: sopan, tidak, sudah, ingin, dan seterusnya.</p><p>Titik awalnya selalu <b>bentuk kamus (辞書形)</b>, yaitu bentuk yang kamu temukan saat mencari kata kerja di kamus. Dari situ kita ubah.</p><div class="fm"><span class="blk k-v">{食|た}べる</span><span class="blk k-p">→</span><span class="blk k-v">{食|た}べます</span><span class="blk k-p">→</span><span class="blk k-v">{食|た}べません</span><span class="blk k-p">→</span><span class="blk k-v">{食|た}べました</span></div><p class="small muted">makan → makan (sopan) → tidak makan → sudah makan</p><p>Cara mengubahnya <b>berbeda untuk tiap kelompok</b>, jadi langkah pertama selalu: tentukan kelompok kata kerjanya.</p>',true);
  const s2=sec('2. Langkah 1: tentukan kelompok','<p>Lihat bentuk kamusnya, lalu jawab berurutan:</p><ol><li><b>Apakah ini する atau 来る</b> (termasuk kata gabungan seperti べんきょうする)? Kalau ya, itu <b>kelompok 3</b>. Hanya dua kata ini.</li><li><b>Apakah berakhiran る, dan bunyi tepat sebelum る adalah i atau e?</b> Contoh: た<b>べ</b>る (e), み<b>る</b> (i), お<b>き</b>る (i). Kalau ya, kemungkinan besar <b>kelompok 2</b>.</li><li><b>Selain itu</b> adalah <b>kelompok 1</b>. Ini mencakup semua yang berakhiran う く ぐ す つ ぬ ぶ む, dan る setelah bunyi a, u, o seperti の<b>る</b>, つく<b>る</b>, あ<b>る</b>.</li></ol>'+w('Ada kata yang <b>tampak kelompok 2 tapi sebenarnya kelompok 1</b>: 帰る, 入る, 知る, 切る, 走る, 要る. Hafalkan saja, jumlahnya sedikit. Tiap kata kerja di bawah punya label kelompoknya, jadi kamu bisa cek di sana.')+'<p class="small muted">Nama lain: kelompok 1 disebut 五段 (godan), kelompok 2 disebut 一段 (ichidan), dan kelompok 3 disebut 不規則 (tidak beraturan).</p>');
  const s3=sec('3. Langkah 2: ubah ke ます dan ない','<p><b>Kelompok 2</b> paling mudah: buang る, lalu tambahkan akhiran.</p>'+tblHTML({head:['Bentuk kamus','ます','ない'],rows:[['たべる','たべ<b>ます</b>','たべ<b>ない</b>'],['みる','み<b>ます</b>','み<b>ない</b>']]})+'<p><b>Kelompok 3</b> hanya dua pola, hafalkan:</p>'+tblHTML({head:['Bentuk kamus','ます','ない'],rows:[['する','します','しない'],['くる (来る)','きます','こない']]})+'<p><b>Kelompok 1</b>: huruf terakhir <b>digeser</b> ke baris lain. Untuk ます pakai baris い, untuk ない pakai baris あ.</p>'+tblHTML({head:['Akhiran','ない (baris あ)','ます (baris い)','Contoh'],rows:[['う','わ','い','かう → かわない / かいます'],['く','か','き','かく → かかない / かきます'],['ぐ','が','ぎ','およぐ → およがない / およぎます'],['す','さ','し','はなす → はなさない / はなします'],['つ','た','ち','まつ → またない / まちます'],['ぬ','な','に','しぬ → しなない / しにます'],['ぶ','ば','び','あそぶ → あそばない / あそびます'],['む','ま','み','のむ → のまない / のみます'],['る','ら','り','のる → のらない / のります']]})+w('Perhatikan <b>う</b>: ない-nya memakai <b>わ</b> (かう → かわない), bukan あ. Satu-satunya pengecualian lain: ある, ない-nya cukup <b>ない</b>.')+'<p class="small muted">Dari ます, bentuk ません, ました, dan ませんでした tinggal mengganti ます. Dari ない, bentuk なかった tinggal mengganti ない.</p>');
  const s4=sec('4. て形 dan た形','<p>て形 dipakai untuk meminta (たべてください), menyambung kegiatan, dan banyak pola lain. た形 adalah lampau kasual, dan aturannya <b>sama persis</b>: tinggal ganti て menjadi た, dan で menjadi だ.</p><p><b>Kelompok 1</b> berubah menurut huruf terakhir. Ingat dalam empat kelompok:</p>'+tblHTML({head:['Akhiran','て','た','Contoh'],rows:[['う つ る','って','った','かう → かって / かった'],['む ぶ ぬ','んで','んだ','のむ → のんで / のんだ'],['く','いて','いた','かく → かいて / かいた'],['ぐ','いで','いだ','およぐ → およいで / およいだ'],['す','して','した','はなす → はなして / はなした']]})+w('<b>Pengecualian: 行く</b> menjadi いって / いった (bukan いいて).')+'<p><b>Kelompok 2</b>: buang る, tambah て atau た (たべる → たべて / たべた).</p><p><b>Kelompok 3</b>: する → して / した, くる → きて / きた.</p>');
  const s5=sec('5. Kapan pakai bentuk yang mana?','<p>Contoh kalimat tiap bentuk. Ketuk kata di tabel kata kerja untuk melihat bentuk lengkapnya.</p>'+tblHTML({head:['Bentuk','Fungsi','Contoh'],rows:[['ます形','sopan, kebiasaan atau akan','{毎日|まいにち}{本|ほん}を{読|よ}みます。<br><span class="small muted">Setiap hari saya membaca buku.</span>'],['ません','tidak (sopan)','コーヒーを{飲|の}みません。<br><span class="small muted">Saya tidak minum kopi.</span>'],['ました','sudah (sopan)','{昨日|きのう}{映画|えいが}を{見|み}ました。<br><span class="small muted">Kemarin saya menonton film.</span>'],['ませんでした','tidak, di masa lalu (sopan)','{昨日|きのう}{勉強|べんきょう}しませんでした。<br><span class="small muted">Kemarin saya tidak belajar.</span>'],['ない形','tidak (kasual), dasar ないでください','{食|た}べないでください。<br><span class="small muted">Tolong jangan makan.</span>'],['なかった','tidak, di masa lalu (kasual)','{昨日|きのう}は{行|い}かなかった。<br><span class="small muted">Kemarin tidak pergi.</span>'],['た形','sudah (kasual)','{昨日|きのう}{寿司|すし}を{食|た}べた。<br><span class="small muted">Kemarin makan sushi.</span>'],['て形','meminta, menyambung','{座|すわ}ってください。<br><span class="small muted">Silakan duduk.</span>'],['たい形','ingin','{水|みず}が{飲|の}みたいです。<br><span class="small muted">Saya ingin minum air.</span>'],['たくない','tidak ingin','{行|い}きたくないです。<br><span class="small muted">Saya tidak ingin pergi.</span>'],['辞書形','bentuk kamus, dasar banyak pola','{泳|およ}ぐことができます。<br><span class="small muted">Bisa berenang.</span>']]})+'<p class="small muted">Sopan (ます) dipakai ke orang yang baru kenal atau lebih tua. Kasual (ない, た) dipakai ke teman dekat dan keluarga.</p>');
  return '<div class="stack"><div class="eyebrow">Baca dari atas ke bawah</div>'+s1+s2+s3+s4+s5+'</div>';
}
function kkHTML(Ws,rules){
  let h=rules?kkRules():'';
  [1,2,3].forEach(function(g){const l=Ws.filter(function(w){return w.g===g});if(l.length)h+='<div class="stack"><h3>'+KKG[g][0]+' '+KKG[g][2]+' ('+l.length+')</h3>'+l.map(kkRow).join('')+'</div>'});
  return h;
}
const TCATS=[['angka','Angka','Bilangan dari 0 sampai puluhan ribu.',[6,8,9,10,11]],['hitung','Penghitung','Cara menghitung benda, orang, dan lainnya.',[12,13,21,22,23]],['waktu','Waktu','Jam, menit, tanggal, bulan, hari, dan lama waktu.',[7,14,15,16,17,18,19,20]],['tata','Tata bahasa','Perbandingan pola dari Pelajaran 1 dan 2.',[1,2,3,4,5,24,25,26]]];
function tblCatOf(t){for(let i=0;i<TCATS.length;i++)if(TCATS[i][3].indexOf(t.id)>=0)return TCATS[i][0];return 'lain'}
function tblChips(Ts){
  const all=[['all','Semua',Ts.length]].concat(TCATS.map(function(c){return [c[0],c[1],Ts.filter(function(t){return tblCatOf(t)===c[0]}).length]}));
  return '<div class="fcfilter">'+all.map(function(c){return '<button class="fil" type="button" data-a="tsub" data-v="'+c[0]+'" aria-pressed="'+(ui.tsub===c[0])+'">'+c[1]+' ('+c[2]+')</button>'}).join('')+'</div>';
}
function tblGrouped(Ts){
  let h='';
  TCATS.forEach(function(c){
    if(ui.tsub!=='all'&&ui.tsub!==c[0])return;
    const l=c[3].map(function(id){return Ts.find(function(t){return t.id===id})}).filter(Boolean);
    if(l.length)h+='<div class="stack"><div><h3>'+c[1]+' ('+l.length+')</h3><p class="muted small">'+c[2]+'</p></div>'+l.map(tblSum).join('')+'</div>';
  });
  const lain=Ts.filter(function(t){return tblCatOf(t)==='lain'});
  if(lain.length&&ui.tsub==='all')h+='<div class="stack"><h3>Lainnya ('+lain.length+')</h3>'+lain.map(tblSum).join('')+'</div>';
  return h;
}
function getQn(){return S.qn||10}
function cyc(a,n){let r=[];while(r.length<n)r=r.concat(shuf(a));return r.slice(0,n)}
function results(){
  const terms=ui.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hit=b=>terms.every(t=>b.indexOf(t)>=0);
  const tab=ui.stab;
  let P=PAT.filter(p=>hit(blobP(p))),Vs=V.filter(v=>hit(blobV(v))),Ts=TB.filter(t=>hit(blobT(t))),Ks=KJ.filter(k=>hit(blobK(k))),Ws=KK.filter(w=>hit(blobW(w)));
  if(tab==='fav'){P=P.filter(p=>S.stars['p:'+p.id]);Vs=Vs.filter(v=>S.stars['v:'+v.id]);Ts=Ts.filter(t=>S.stars['t:'+t.id]);Ks=Ks.filter(k=>S.stars['k:'+k.k]);Ws=Ws.filter(w=>S.stars['w:'+w.k])}
  if(tab==='pat'){Vs=[];Ts=[];Ks=[];Ws=[]}
  if(tab==='vocab'){P=[];Ts=[];Ks=[];Ws=[]}
  if(tab==='kana')return kanaHTML();
  if(tab==='tbl'){P=[];Vs=[];Ks=[];Ws=[]}
  if(tab==='kanji'){P=[];Vs=[];Ts=[];Ws=[]}
  if(tab==='kk'){P=[];Vs=[];Ts=[];Ks=[]}
  if(tab==='all'&&!terms.length){Ks=[];Ws=[]}
  let out='';
  if(tab==='fav'){
    const hv=V.filter(v=>S.hard[v.id]);
    if(hv.length&&!terms.length)out+='<div class="panel"><h3 style="margin-bottom:6px">Kata sulit</h3><p class="muted small">Kata yang sering salah di kartu atau kuis. Hilang otomatis kalau sudah benar beberapa kali.</p>'+hv.map(vocRow).join('')+'</div>';
  }
  if(P.length)out+='<div class="stack"><h3>Pola</h3>'+P.map(patSum).join('')+'</div>';
  if(Ts.length)out+=(tab==='tbl'?tblGrouped(Ts):'<div class="stack"><h3>Tabel perbandingan</h3>'+Ts.map(tblSum).join('')+'</div>');
  if(Vs.length){const lim=(tab==='vocab'||terms.length||tab==='fav')?500:12;out+='<div class="panel"><h3 style="margin-bottom:6px">Kosakata ('+Vs.length+')</h3>'+Vs.slice(0,lim).map(vocRow).join('')+(Vs.length>lim?'<div class="row" style="margin-top:10px"><button class="btn sm" type="button" data-a="stab" data-v="vocab">Lihat semua kosakata</button></div>':'')+'</div>'}
  if(Ks.length)out+=kjHTML(Ks);
  if(Ws.length)out+=kkHTML(Ws,tab==='kk'&&!terms.length);
  if(!out){
    out='<div class="card empty">'+momo('sleep',90)+'<h3>'+(tab==='fav'&&!terms.length?'Belum ada favorit':'Tidak ketemu')+'</h3><p class="muted">'+(tab==='fav'&&!terms.length?'Ketuk ikon bintang di pola, kata, atau tabel supaya muncul di sini.':'Coba kata lain, misalnya "dengan", "で", atau "kunci".')+'</p></div>';
  }
  return (tab==='tbl'?tblChips(Ts):'')+out;
}
function vCari(){
  const tabs=[['all','Semua'],['pat','Pola'],['vocab','Kosakata'],['tbl','Tabel'],['kana','Kana'],['kanji','Kanji'],['kk','Kata kerja'],['fav','Favorit']].map(t=>'<button class="fil" type="button" data-a="stab" data-v="'+t[0]+'" aria-pressed="'+(ui.stab===t[0])+'">'+t[1]+'</button>').join('');
  return '<section class="stack"><div><div class="eyebrow">Buat yang lupa</div><h2>Referensi</h2></div>'+
  '<label class="search" for="q">'+ic('search')+'<input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Cari kata, pola, atau arti (contoh: で, dengan, kunci)" value="'+esc(ui.q)+'"></label>'+
  '<div class="tabs" role="group" aria-label="Jenis hasil">'+tabs+'</div><div class="stack" id="results">'+results()+'</div></section>';
}

/* ============ render ============ */
function chips(){
  $('#chS').innerHTML=ic('flame')+curStreak()+' hari';
  $('#chX').innerHTML=ic('star')+S.xp+' XP';
}
function renderNav(){
  const r=route();
  $('#nav').innerHTML=NAV.map(n=>'<a href="#'+n[0]+'"'+(r===n[0]?' aria-current="page"':'')+'>'+ic(n[2])+'<span>'+n[1]+'</span></a>').join('');
}
function render(top){
  const r=route();
  renderNav();
  const V_={beranda:vHome,belajar:vBelajar,kartu:vKartu,kuis:vKuis,cari:vCari};
  $('#view').innerHTML=V_[r]();
  document.body.classList.toggle('nofuri',!S.furi);
  $('#furiBtn').setAttribute('aria-pressed',String(!!S.furi));
  chips();
  if(top)window.scrollTo(0,0);
}

/* ============ aksi ============ */
function rate(r){
  const f=ui.fc;const id=f.q[f.i];const c=S.cards[id];const isNew=!c;let b,xp;
  if(r==='again'){S.cards[id]={b:0,d:Date.now()};S.hard[id]=(S.hard[id]||0)+1;f.rq[id]=(f.rq[id]||0)+1;if(f.rq[id]<=2)f.q.push(id);xp=1;f.stat.again++}
  else if(r==='hard'){b=isNew?1:Math.max(1,c.b);S.cards[id]={b:b,d:sod()+INT[b]*DAY};xp=3;f.stat.hard++}
  else{b=isNew?2:Math.min(6,c.b+1);S.cards[id]={b:b,d:sod()+INT[b]*DAY};if(S.hard[id]){S.hard[id]--;if(S.hard[id]<=0)delete S.hard[id]}xp=5;f.stat.good++}
  f.n++;f.i++;f.flip=false;award(xp,1);render(false);
}
function openPat(id){ui.pid=+id;if(route()==='belajar')render(true);else location.hash='#belajar'}
function lookup(q){ui.q=q;ui.stab='all';go('cari')}
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  switch(a){
    case 'nav':go(v);break;
    case 'furi':S.furi=!S.furi;save();render(false);break;
    case 'speak':speak(el.dataset.t);break;
    case 'star':{const k=el.dataset.k;if(S.stars[k])delete S.stars[k];else S.stars[k]=1;save();render(false);break}
    case 'openpat':openPat(v);break;
    case 'back':ui.pid=null;render(true);break;
    case 'retry':{const p=PB[v];delete ui.pans[p.id];p.q.forEach((q,i)=>{delete ui.perm[p.id+':'+i]});render(false);break}
    case 'pans':{
      const p=PB[el.dataset.p],qi=+el.dataset.q,c=+el.dataset.c;
      const m=ui.pans[p.id]||(ui.pans[p.id]={});if(m[qi]!==undefined)break;
      m[qi]=c;const ok=c===p.q[qi].a;award(ok?10:0,1);
      if(Object.keys(m).length===p.q.length){const sc=p.q.filter((q,i)=>m[i]===q.a).length;const first=S.pdone[p.id]===undefined;if(first||sc>S.pdone[p.id]){S.pdone[p.id]=sc;save()}if(first)award(20,0)}
      render(false);break}
    case 'fcf':ui.fcf=v;render(false);break;
    case 'fdeck':ui.fd=v;ui.fcf='all';render(false);break;
    case 'fcstart':{const q=fcQueue(ui.fcf,ui.fd==='k'?'k':'v');const ids=q.due.concat(q.fresh.slice(0,10)).slice(0,30);if(!ids.length)break;ui.fc={q:ids,i:0,flip:false,n:0,rq:{},stat:{again:0,hard:0,good:0}};render(true);break}
    case 'fcfree':{const ids=shuf(cardIds(ui.fcf,ui.fd==='k'?'k':'v')).slice(0,10);if(!ids.length){toast('Tidak ada kartu di filter ini.');break}ui.fc={q:ids,i:0,flip:false,n:0,rq:{},stat:{again:0,hard:0,good:0}};render(true);break}
    case 'flip':if(ui.fc){ui.fc.flip=!ui.fc.flip;render(false)}break;
    case 'rate':if(ui.fc&&ui.fc.flip)rate(v);break;
    case 'fcend':ui.fc=null;render(true);break;
    case 'lookup':lookup(v);break;
    case 'quiz':startQuiz(v,el.dataset.n?+el.dataset.n:0);if(route()!=='kuis')location.hash='#kuis';break;
    case 'qzend':ui.qz=null;render(true);break;
    case 'qretry':{const z=ui.qz;if(!z||!z.wr||!z.wr.length)break;ui.qz={mode:z.mode,n:z.n,qs:shuf(z.wr.map(x=>x.q)),i:0,score:0,picked:null,o:null,xp:0,wr:[]};render(true);break}
    case 'qans':{
      const z=ui.qz;if(!z||z.picked!==null)break;const q=z.qs[z.i];const i=+v;z.picked=i;const ok=i===q.a;
      if(ok){z.score++;z.xp+=10}else z.wr.push({q:q,pk:i});
      if(q.vid){if(ok){if(S.hard[q.vid]){S.hard[q.vid]--;if(S.hard[q.vid]<=0)delete S.hard[q.vid]}}else S.hard[q.vid]=(S.hard[q.vid]||0)+1}
      award(ok?10:0,1);render(false);break}
    case 'opick':{const o=ui.qz.o;if(o.res!==null)break;o.ans.push(o.pool.splice(+v,1)[0]);render(false);break}
    case 'ounpick':{const o=ui.qz.o;if(o.res!==null)break;o.pool.push(o.ans.splice(+v,1)[0]);render(false);break}
    case 'ocheck':{
      const z=ui.qz,q=z.qs[z.i],o=z.o;const ok=o.ans.map(t=>t.t).join('')===q.tk.join('');
      o.res=ok;if(ok){z.score++;z.xp+=15}else z.wr.push({q:q,ans:o.ans.map(t=>t.t).join(' ')});award(ok?15:0,1);render(false);break}
    case 'qnext':{const z=ui.qz;z.i++;z.picked=null;z.o=null;if(z.i>=z.qs.length&&z.score/z.qs.length>=.8){z.xp+=20;award(20,0)}render(true);break}
    case 'qlink':{const q=ui.qz.qs[ui.qz.i];if(q.link.k==='p')openPat(q.link.p);else if(q.link.k==='kana'){ui.stab='kana';ui.kana=q.link.m;ui.q='';go('cari')}else lookup(q.link.q);break}
    case 'stab':ui.stab=v;render(false);break;
    case 'kmode':ui.kana=v;render(false);break;
    case 'tsub':ui.tsub=v;render(false);break;
    case 'les':ui.les=+v;render(false);break;
    case 'openles':ui.les=+v;ui.pid=null;if(route()==='belajar')render(true);else location.hash='#belajar';break;
    case 'qn':S.qn=+v;save();render(false);break;
  }
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){ui.q=e.target.value;$('#results').innerHTML=results()}
});
document.addEventListener('keydown',function(e){
  if(route()==='kartu'&&ui.fc&&ui.fc.i<ui.fc.q.length&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){
    if(e.key===' '||(e.key==='Enter'&&document.activeElement.dataset&&document.activeElement.dataset.a==='flip')){e.preventDefault();ui.fc.flip=!ui.fc.flip;render(false)}
    else if(ui.fc.flip&&(e.key==='1'||e.key==='2'||e.key==='3')){rate(['again','hard','good'][+e.key-1])}
  }
});
window.addEventListener('hashchange',function(){render(true)});
$('#nav').addEventListener('click',function(e){
  const a=e.target.closest('a');if(!a)return;
  const r=a.getAttribute('href').slice(1);
  if(r===route()){e.preventDefault();if(r==='belajar')ui.pid=null;if(r==='kartu')ui.fc=null;if(r==='kuis')ui.qz=null;render(true)}
});

load();rollover();
$('#brandMomo').innerHTML=momo('happy',40);
render(true);
})();
</script>

</body></html>
